  html, body { margin: 0; padding: 0; }
  * { box-sizing: border-box; }

  .sparkle-particle {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #E8A33D;
    opacity: 0;
    pointer-events: none;
    animation: sparkle-pop 0.55s ease-out forwards;
  }
  @keyframes sparkle-pop {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(0.3); }
    55% { opacity: 1; }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1); }

  .battle-stage {
    position: relative;
    height: 66px;
    border-radius: 12px;
    overflow: hidden;
    background: repeating-linear-gradient(135deg, #FFFFFF 0px, #FFFFFF 10px, #F3E9DB 10px, #F3E9DB 20px);

  .bolinho-fighter {
    position: absolute;
    top: 50%;

  .bolinho-fighter.right { right: 6%; animation: charge-right 0.9s ease-in-out infinite; }
  @keyframes charge-left {
    0%, 100% { transform: translateX(0) rotate(-4deg); }
    50% { transform: translateX(13px) rotate(6deg); }
  }
  @keyframes charge-right {
    0%, 100% { transform: translateX(0) rotate(4deg); }
    50% { transform: translateX(-13px) rotate(-6deg); }
  }
  .confrontar-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 72%;
    padding: 12px 0;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #6B4226, #8A5A26);

  .confrontar-btn:disabled { opacity: 0.75; cursor: default; }
  .confrontar-btn:active:not(:disabled) { transform: translate(-50%, -50%) scale(0.97); }

function dataLocalStr(d = new Date()) {
  const ano = d.getFullYear();
  const mes = String(d.getMonth() + 1).padStart(2, "0");
  const dia = String(d.getDate()).padStart(2, "0");
  return `${ano}-${mes}-${dia}`;
}
function hojeStr() {
  return dataLocalStr();
}
function ontemStr() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return dataLocalStr(d);
}
function amanhaStr() {
  const d = new Date();
  d.setDate(d.getDate() + 1);
  return dataLocalStr(d);
}
function horaAtualDecimal() {
  const d = new Date();
  return d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600;
}
function passouDas22h() {
  return horaAtualDecimal() >= 22;
}
function chegouAs10h() {
  return horaAtualDecimal() >= 10;
}
function timestampLocalHojeHora(hora, minuto = 0, segundo = 0) {
  const d = new Date();
  d.setHours(hora, minuto, segundo, 0);

function ehDataPassada(data) {
  return data < hojeStr();

function ehDataFutura(data) {

function dataBloqueada(data) {

function formatarData(iso) {
  if (!iso) return "";

function formatarDataHora(ts) {
  const d = new Date(ts);

function normalizarTexto(txt) {
  return (txt || "")
    .toString()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .trim();
}
function normalizarChave(txt) {
  return normalizarTexto(txt).replace(/[^a-z0-9]/g, "");
}

async function lerArquivoPlanilha(file) {
  const buffer = await file.arrayBuffer();
  const wb = XLSX.read(buffer, { type: "array" });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
}

// Procura, nas primeiras linhas, a linha de cabeçalho com as colunas "produto" e "numvendas"
function encontrarColunasPDV(linhas) {
  for (let i = 0; i < Math.min(linhas.length, 6); i++) {
    const linha = linhas[i] || [];
    let colProduto = -1, colQtd = -1;
    linha.forEach((c, idx) => {
      const chave = normalizarChave(c);
      if (colProduto === -1 && chave.includes("produto")) colProduto = idx;
      if (colQtd === -1 && chave.includes("numvendas")) colQtd = idx;
    });
    if (colProduto !== -1 && colQtd !== -1) return { headerRow: i, colProduto, colQtd };
  }
  return null;
}

// Modo genérico: procura a coluna de quantidade dando prioridade a "num vendas" / "vendas"
// antes de cair em termos genéricos como "quantidade", que podem se referir a outra coisa na planilha
function encontrarColunaQuantidadeGenerica(linhas) {
  const gruposPrioridade = [
    ["numvendas"],
    ["vendas"],
    ["qtd", "quantidade", "qtde", "quant", "unid"],
  ];
  for (const grupo of gruposPrioridade) {
    for (let i = 0; i < Math.min(linhas.length, 5); i++) {
      const linha = linhas[i] || [];
      for (let c = 0; c < linha.length; c++) {
        const norm = normalizarChave(linha[c]);
        if (grupo.some((p) => norm.includes(p))) return c;
      }
    }
  }
  return null;
}

// Lê as linhas da planilha e tenta casar cada item cadastrado com uma linha,
// usando as colunas "produto" e "numvendas" quando existem; senão cai no modo genérico
function processarPlanilhaPDV(linhas) {
  const resultado = {};
  ITEMS.forEach((item) => { resultado[item.id] = null; });

  const colunas = encontrarColunasPDV(linhas);

  if (colunas) {
    for (let i = colunas.headerRow + 1; i < linhas.length; i++) {
      const linha = linhas[i] || [];
      const nomeProduto = normalizarTexto(linha[colunas.colProduto]);
      if (!nomeProduto) continue;
      const qtdRaw = linha[colunas.colQtd];
      const qtd = typeof qtdRaw === "number" ? qtdRaw : parseFloat(qtdRaw);
      if (isNaN(qtd)) continue;
      ITEMS.forEach((item) => {
        const nomeItem = normalizarTexto(item.nome);
        if (nomeProduto.includes(nomeItem) || nomeItem.includes(nomeProduto)) {
          resultado[item.id] = (resultado[item.id] || 0) + qtd;
        }
      });
    }
    return resultado;
  }

  // Modo genérico (planilha sem as colunas "produto"/"numvendas" reconhecíveis)
  const colQtd = encontrarColunaQuantidadeGenerica(linhas);
  linhas.forEach((linhaBruta) => {
    const linha = linhaBruta || [];
    const textosLinha = linha.map((c) => normalizarTexto(c));
    ITEMS.forEach((item) => {
      const nomeItem = normalizarTexto(item.nome);
      const bateu = textosLinha.some((t) => t.length > 2 && (t.includes(nomeItem) || nomeItem.includes(t)));
      if (!bateu) return;
      let qtd = null;
      if (colQtd !== null && typeof linha[colQtd] === "number") {
        qtd = linha[colQtd];
      } else {
        for (const c of linha) {
          if (typeof c === "number") { qtd = c; break; }
        }
      }
      if (qtd !== null) resultado[item.id] = (resultado[item.id] || 0) + qtd;
    });
  });
  return resultado;
}

// Busca todos os registros de um tipo para uma data, já preenchendo os itens sem registro com 0
async function buscarRegistros(tipo, data) {
  const { data: rows, error } = await sb
    .from("registros")
    .select("*")
    .eq("tipo", tipo)
    .eq("data", data);
  const base = Object.fromEntries(ITEMS.map((i) => [i.id, tipo === "entrada" ? { qtd: 0, foto: null, nomeArquivo: null } : 0]));
  if (error || !rows) return { base, error: !!error };
  rows.forEach((r) => {
    if (tipo === "entrada") {
      base[r.item_id] = { qtd: r.quantidade, foto: r.foto_url, nomeArquivo: r.nome_arquivo };
    } else {
      base[r.item_id] = r.quantidade;
    }
  });
  return { base, error: false };
}

async function salvarRegistro({ item_id, data, tipo, quantidade, foto_url, nome_arquivo }) {
  const payload = { item_id, data, tipo, quantidade };
  if (foto_url !== undefined) payload.foto_url = foto_url;
  if (nome_arquivo !== undefined) payload.nome_arquivo = nome_arquivo;

  const { error } = await sb
    .from("registros")
    .upsert(payload, { onConflict: "item_id,data,tipo" });

  if (!error) {
    await sb.from("alteracoes").insert({
      aba: abaDoTipo(tipo),
      item_id,
      data,
      quantidade,
      usuario_nome: usuarioAtualNome || "Usuário",
    });
  }

  return !error;
}

function SparkleBurst({ triggerKey }) {
  if (!triggerKey) return null;
  const n = 6;
  return (
    <span key={triggerKey} style={{ position: "absolute", inset: 0, pointerEvents: "none" }}>
      {Array.from({ length: n }).map((_, i) => {
        const angle = (i / n) * Math.PI * 2;
        const dist = 16 + (i % 2) * 6;
        const dx = Math.cos(angle) * dist;
        const dy = Math.sin(angle) * dist;
        return (
          <span key={i} className="sparkle-particle"
            style={{ left: "50%", top: "50%", "--dx": `${dx}px`, "--dy": `${dy}px`, animationDelay: `${i * 0.02}s` }} />
        );
      })}
    </span>
  );
}

  const passada = ehDataPassada(data);
  const futura = ehDataFutura(data);
  const bloqueada = dataBloqueada(data);
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>

  const [carregando, setCarregando] = useState(true);
  const [erro, setErro] = useState(false);

  useEffect(() => {
    let ativo = true;
    setCarregando(true);
    buscarRegistros(tipo, data).then((res) => {
      if (!ativo) return;
      setValores(res.base);
      setErro(res.error);
      setCarregando(false);
    });

  }, [tipo, data]);

  return { data, setData, valores, setValores, carregando, erro };
}

      const linhas = await lerArquivoPlanilha(file);

const amarelo = "#B8860B";
const amareloSoft = "#FBF3D9";
const verdeSoft = "#E7F3E9";

// =========================
// CICLO AUTOMÁTICO DIÁRIO
// 22h: congela o estoque esperado do dia seguinte.
// 10h: congela o estoque inicial do dia e confronta com o esperado congelado.
// O resultado fica no Supabase e no Histórico. Depois disso, o cálculo normal
// do dia continua e o ciclo se repete para o próximo dia.
// =========================

async function lerMapaRegistrosPermitidos(data) {
  const mapa = Object.fromEntries(ITEMS.map((i) => [i.id, 0]));
  const [inicial, entradas, perdas, vendas] = await Promise.all([
    sb.from("registros").select("item_id, quantidade").eq("tipo", "contagem").eq("data", data),
    sb.from("registros").select("item_id, quantidade").eq("tipo", "entrada").eq("data", data),
    sb.from("registros").select("item_id, quantidade").eq("tipo", "perda").eq("data", data),
    sb.from("registros").select("item_id, quantidade").eq("tipo", "venda").eq("data", data),
  ]);
  if (inicial.error || entradas.error || perdas.error || vendas.error) throw new Error("Não foi possível ler os registros do dia.");
  (inicial.data || []).forEach(r => { mapa[r.item_id] += Number(r.quantidade) || 0; });
  (entradas.data || []).forEach(r => { mapa[r.item_id] += Number(r.quantidade) || 0; });
  (perdas.data || []).forEach(r => { mapa[r.item_id] -= Number(r.quantidade) || 0; });
  (vendas.data || []).forEach(r => { mapa[r.item_id] -= Number(r.quantidade) || 0; });
  return mapa;
}

function mapaPorItens(rows) {
  const mapa = Object.fromEntries(ITEMS.map((i) => [i.id, 0]));
  (rows || []).forEach(r => { mapa[r.item_id] = Number(r.quantidade) || 0; });
  return mapa;
}

// O banco é a autoridade do ciclo. Estas funções apenas acionam o fechamento
// caso o cron ainda não tenha feito o trabalho (fallback para navegador).
async function executarFechamentoDas22h() {
  const dataAlvo = amanhaStr();
  const { data: existente, error } = await sb.from("estoque_fechamentos")
    .select("*").eq("data_referencia", dataAlvo).maybeSingle();
  if (error) throw error;
  if (existente && existente.esperado_congelado_em) return existente;

  const esperado = await lerMapaRegistrosPermitidos(hojeStr());
  const { data, error: erroInsert } = await sb.from("estoque_fechamentos").insert({
    data_referencia: dataAlvo,
    esperado: esperado,
    esperado_congelado_em: new Date().toISOString()
  }).select("*").single();

  if (erroInsert) {
    // Se outra execução acabou de congelar, apenas reutiliza o registro.
    const { data: novamente } = await sb.from("estoque_fechamentos")
      .select("*").eq("data_referencia", dataAlvo).maybeSingle();
    if (novamente) return novamente;
    throw erroInsert;
  }
  return data;
}

async function executarFechamentoDas10h() {
  const dataHoje = hojeStr();
  const { data: ciclo, error: erroCiclo } = await sb.from("estoque_fechamentos")
    .select("*").eq("data_referencia", dataHoje).maybeSingle();
  if (erroCiclo) throw erroCiclo;
  if (!ciclo || !ciclo.esperado_congelado_em) {
    throw new Error("O estoque esperado das 22h de ontem ainda não foi congelado.");
  }
  if (ciclo.confronto_executado_em) return ciclo;

  const { data: inicialRows, error: erroInicial } = await sb.from("registros")
    .select("item_id, quantidade").eq("tipo", "contagem").eq("data", dataHoje);
  if (erroInicial) throw erroInicial;

  const contado = mapaPorItens(inicialRows);
  const esperado = ciclo.esperado || {};
  const linhas = ITEMS.map(item => {
    const esperadoV = Number(esperado[item.id] || 0);
    const contadoV = Number(contado[item.id] || 0);
    const diferenca = contadoV - esperadoV;
    return {
      data_referencia: dataHoje,
      item_id: item.id,
      status: diferenca !== 0 ? "alerta" : "ok",
      estoque_esperado: esperadoV,
      estoque_contado: contadoV,
      diferenca,
      executado_em: new Date().toISOString()
    };
  });

  const { error: erroInsert } = await sb.from("confrontos").insert(linhas);
  if (erroInsert) throw erroInsert;

  // Registro explícito no Histórico do sistema.
  const historico = ITEMS.map(item => {
    const l = linhas.find(x => x.item_id === item.id);
    return {
      data_hora: l.executado_em,
      item_id: item.id,
      item_nome: nomeDoItem(item.id),
      inicio_dia: l.estoque_contado,
      entradas: 0,
      perdas: 0,
      vendas: 0,
      esperado: l.estoque_esperado,
      contado: l.estoque_contado,
      diferenca: l.diferenca,
      status: l.status
    };
  });
  const { error: erroHistorico } = await sb.from("confronto_historico").insert(historico);
  if (erroHistorico) throw erroHistorico;

  const { data: atualizado, error: erroUpdate } = await sb.from("estoque_fechamentos")
    .update({
      estoque_inicial_10h: contado,
      inicial_10h_congelado_em: new Date().toISOString(),
      confronto_executado_em: new Date().toISOString()
    })
    .eq("data_referencia", dataHoje)
    .is("confronto_executado_em", null)
    .select("*").single();

  if (erroUpdate) throw erroUpdate;
  return atualizado;
}

function agendarCicloAutomatico(onResultado) {
  let cancelado = false;
  const verificar = async () => {
    if (cancelado) return;
    try {
      const hora = horaAtualDecimal();
      if (hora >= (22 + 1 / 60)) await executarFechamentoDas22h();
      if (hora >= (10 + 1 / 60)) {
        const resultado = await executarFechamentoDas10h();
        if (onResultado) onResultado(resultado);
      }
    } catch (e) {
      console.error("Ciclo automático diário:", e);
    }
  };
  verificar();
  const timer = setInterval(verificar, 10000);
  return () => { cancelado = true; clearInterval(timer); };
}

function EstoqueEsperadoDia() {
  const [carregando, setCarregando] = useState(false);
  const [resultado, setResultado] = useState(null);
  const [congelado, setCongelado] = useState(false);
  const [erro, setErro] = useState(false);

    setCarregando(true);

    try {
      const alvo = amanhaStr();
      const { data: ciclo, error } = await sb.from("estoque_fechamentos")
        .select("*").eq("data_referencia", alvo).maybeSingle();
      if (error) throw error;

      if (ciclo && ciclo.esperado_congelado_em) {
        setResultado(ciclo.esperado || {});
        setCongelado(true);
      } else if (passouDas22h()) {
        const novo = await executarFechamentoDas22h();
        setResultado(novo.esperado || {});
        setCongelado(true);
      } else {
        setResultado(await lerMapaRegistrosPermitidos(hojeStr()));
        setCongelado(false);
      }
    } catch (e) {
      console.error(e);
      setErro(true);
    }

function Confronto() {
  const [rodando, setRodando] = useState(false);
  const [progresso, setProgresso] = useState(0);
  const [etapaTexto, setEtapaTexto] = useState("");
  const [msgFinal, setMsgFinal] = useState(null);
  const [recarregarChave, setRecarregarChave] = useState(0);
  const [pedirSenha, setPedirSenha] = useState(false);

  const iniciarConfronto = () => {
    if (rodando) return;
    setPedirSenha(true);
  };

  const confrontarAgora = () => {
    setMsgFinal(null);
    setRodando(true);
    setProgresso(0);
    let passo = 0;
    const proximo = async () => {
      if (passo >= ETAPAS_CONFRONTO.length) {
        try {
          const hoje = hojeStr();
          const { data: ciclo, error: erroCiclo } = await sb.from("estoque_fechamentos")
            .select("*").eq("data_referencia", hoje).maybeSingle();
          if (erroCiclo) throw erroCiclo;
          if (!ciclo || !ciclo.esperado_congelado_em) {
            throw new Error("Ainda não existe estoque esperado congelado das 22h de ontem.");
          }
          if (!ciclo.inicial_10h_congelado_em) {
            await executarFechamentoDas10h();
          }
          const { data: cicloAtualizado, error: erroLeitura } = await sb.from("estoque_fechamentos")
            .select("*").eq("data_referencia", hoje).single();
          if (erroLeitura) throw erroLeitura;

          const esperado = cicloAtualizado.esperado || {};
          const estoqueInicial = cicloAtualizado.estoque_inicial_10h || {};
          const executadoEm = new Date().toISOString();
          const linhas = ITEMS.map(item => {
            const esperadoV = Number(esperado[item.id] || 0);
            const contadoV = Number(estoqueInicial[item.id] || 0);
            const diferenca = contadoV - esperadoV;
            return {
              data_referencia: hoje,
              executado_em: executadoEm,
              item_id: item.id,
              status: diferenca !== 0 ? "alerta" : "ok",
              estoque_esperado: esperadoV,
              estoque_contado: contadoV,
              diferenca
            };
          });
          const { data: existentes } = await sb.from("confrontos")
            .select("id").eq("data_referencia", hoje).limit(ITEMS.length);
          if (!existentes || existentes.length < ITEMS.length) {
            const { error: erroInsert } = await sb.from("confrontos").insert(linhas);
            if (erroInsert) throw new Error(erroInsert.message);
            const historico = linhas.map(l => ({
              data_hora: executadoEm, item_id: l.item_id, item_nome: nomeDoItem(l.item_id),
              inicio_dia: l.estoque_contado, entradas: 0, perdas: 0, vendas: 0,
              esperado: l.estoque_esperado, contado: l.estoque_contado,
              diferenca: l.diferenca, status: l.status
            }));
            const { error: erroHist } = await sb.from("confronto_historico").insert(historico);
            if (erroHist) throw erroHist;
          }

          const temInconsistencia = linhas.some((l) => l.status === "alerta");
          setMsgFinal({
            ok: true,
            texto: temInconsistencia ? "Confronto concluído: foram encontradas inconsistências." : "Confronto concluído: tudo bate certinho.",
          });
        } catch (e) {
          setMsgFinal({ ok: false, texto: "Erro: " + (e && e.message ? e.message : String(e)) });
        }
        setRodando(false);
        setRecarregarChave((k) => k + 1);
        return;
      }
      setEtapaTexto(ETAPAS_CONFRONTO[passo]);
      setProgresso(Math.round(((passo + 1) / ETAPAS_CONFRONTO.length) * 100));
      passo++;
      setTimeout(proximo, 450);
    };
    proximo();
  };

  return (
    <div style={{ padding: 16, display: "flex", flexDirection: "column", gap: 12 }}>
      <EstoqueEsperadoDia />

      <div style={{ height: 1, background: line, margin: "2px 0" }} />

      <div className="battle-stage">
        <div className="bolinho-fighter left"><BolinhoFighter mirrored={false} /></div>
        <div className="bolinho-fighter right"><BolinhoFighter mirrored={true} /></div>
        <button className="confrontar-btn" onClick={iniciarConfronto} disabled={rodando}>
          {rodando ? "Analisando..." : "⚔ Confrontar agora"}
        </button>
      </div>

      {pedirSenha && !rodando && (
        <div style={{
          position: "fixed", inset: 0, zIndex: 100, background: "rgba(59,42,30,0.35)",
          display: "flex", alignItems: "center", justifyContent: "center", padding: 20
        }}>
          <div style={{
            width: "min(320px, 100%)", background: card, border: `1px solid ${line}`,
            borderRadius: 14, boxShadow: "0 16px 40px rgba(59,42,30,0.25)"
          }}>
            <SenhaGate
              titulo="Digite a senha para realizar o confronto"
              senhaCerta={SENHA_GERAL}
              onEntrar={() => { setPedirSenha(false); confrontarAgora(); }}
            />
            <button onClick={() => setPedirSenha(false)} style={{
              display: "block", margin: "-4px auto 14px", background: "transparent",
              border: "none", color: inkSoft, fontFamily: sans, fontSize: 12,
              cursor: "pointer"
            }}>Cancelar</button>
          </div>
        </div>
      )}

      {rodando && (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          <div style={{ fontFamily: sans, fontSize: 12, color: inkSoft, textAlign: "center" }}>{etapaTexto}</div>
          <div style={{ width: "100%", height: 8, background: accentSoft, borderRadius: 99, overflow: "hidden" }}>
            <div style={{ width: `${progresso}%`, height: "100%", background: accent, borderRadius: 99, transition: "width 0.5s ease" }} />
          </div>
        </div>
      )}

      {msgFinal && !rodando && (
        <div style={{ fontFamily: sans, fontWeight: 700, fontSize: 12.5, color: msgFinal.ok ? good : danger, textAlign: "center" }}>
          {msgFinal.texto}
        </div>
      )}

      <div style={{ fontFamily: sans, fontWeight: 800, fontSize: 13.5, color: ink }}>Último confronto</div>
      <UltimoConfronto recarregarChave={recarregarChave} />

      <div style={{ fontFamily: sans, fontSize: 10.5, color: inkSoft, textAlign: "center" }}>
        Compara o estoque esperado trancado do dia anterior com o estoque inicial contado pelos funcionários no novo dia.
      </div>
    </div>
  );
}

function formatBytesAdmin(bytes) {
  if (bytes == null || isNaN(bytes)) return "—";
  const units = ["B", "KB", "MB", "GB", "TB"];
  let n = Number(bytes), u = 0;
  while (n >= 1024 && u < units.length - 1) { n /= 1024; u++; }
  return `${n.toFixed(n >= 100 ? 0 : n >= 10 ? 1 : 2)} ${units[u]}`;
}

async function carregarPerfilAtual(session) {
  if (!session?.user?.id) return null;
  const { data, error } = await sb
    .from("perfis")
    .select("id, usuario, nome, permissoes")
    .eq("id", session.user.id)
    .single();

  if (error || !data) return null;
  const nomeAtual = data.nome || data.usuario;
  usuarioAtualNome = nomeAtual;

  return {
    id: data.id,
    nome: nomeAtual,
    usuario: data.usuario,
    permissoes: Array.isArray(data.permissoes) ? data.permissoes : []
  };
}

async function autenticarPorUsuario(usuario, senha) {
  const nomeUsuario = usuario.trim();
  if (!nomeUsuario || !senha) throw new Error("Informe usuário e senha.");

  // O nome de usuário é convertido para o e-mail do Auth por uma função SQL.
  // A senha nunca é consultada nem armazenada pelo JavaScript.
  const { data: email, error: erroEmail } = await sb
    .rpc("obter_email_login", { p_usuario: nomeUsuario });

  if (erroEmail || !email) throw new Error("Usuário ou senha incorretos.");

  const { data, error } = await sb.auth.signInWithPassword({
    email,
    password: senha
  });

  if (error || !data?.session) throw new Error("Usuário ou senha incorretos.");

  const perfil = await carregarPerfilAtual(data.session);
  if (!perfil) {
    await sb.auth.signOut();
    throw new Error("Usuário autenticado, mas sem perfil de acesso configurado.");
  }
  return perfil;
}

      onLogin(perfil);
    } catch (e) {
      setErro(e?.message || "Usuário ou senha incorretos.");
    } finally {
      setEntrando(false);
    }
  };

  return (
    <div style={{minHeight:"100vh",background:bgStripes,display:"flex",alignItems:"center",justifyContent:"center",padding:20,boxSizing:"border-box",fontFamily:sans}}>
      <div style={{width:"min(360px,100%)",background:card,border:`1px solid ${line}`,borderRadius:20,boxShadow:"0 16px 40px rgba(59,42,30,0.18)",padding:22,boxSizing:"border-box"}}>
        <div style={{fontFamily:sansArredondado,fontWeight:800,fontSize:22,color:ink,textAlign:"center",marginBottom:4}}>Fofíssimo Controle</div>
        <div style={{fontFamily:sans,fontSize:11,color:inkSoft,textAlign:"center",marginBottom:20}}>Entre com seu usuário para acessar o sistema</div>
        <label style={{display:"block",fontFamily:sans,fontSize:11.5,fontWeight:700,color:ink,marginBottom:5}}>Usuário</label>
        <input value={usuario} onChange={e=>{setUsuario(e.target.value);setErro("");}} onKeyDown={e=>{if(e.key==="Enter")entrar();}} autoComplete="username"
          style={{width:"100%",boxSizing:"border-box",padding:"11px 12px",border:`1px solid ${line}`,borderRadius:9,fontFamily:sans,fontSize:14,marginBottom:11}} />
        <label style={{display:"block",fontFamily:sans,fontSize:11.5,fontWeight:700,color:ink,marginBottom:5}}>Senha</label>
        <div style={{position:"relative",width:"100%",marginBottom:11}}>
          <input type={mostrarSenha ? "text" : "password"} value={senha}
            onChange={e=>{setSenha(e.target.value);setErro("");}}
            onKeyDown={e=>{if(e.key==="Enter")entrar();}}
            autoComplete="current-password"
            style={{width:"100%",boxSizing:"border-box",padding:"11px 42px 11px 12px",border:`1px solid ${line}`,borderRadius:9,fontFamily:sans,fontSize:14}} />
          <button
            type="button"
            onClick={()=>setMostrarSenha(v=>!v)}
            aria-label={mostrarSenha ? "Ocultar senha" : "Mostrar senha"}
            title={mostrarSenha ? "Ocultar senha" : "Mostrar senha"}
            style={{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",width:30,height:30,border:"none",background:"transparent",color:inkSoft,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",padding:0}}
          >
            <Icon name="eye" size={18} color={inkSoft} />
          </button>
        </div>
        {erro && <div style={{fontFamily:sans,fontSize:11.5,color:danger,textAlign:"center",marginBottom:10}}>{erro}</div>}
        <button onClick={entrar} disabled={entrando} style={{width:"100%",padding:"11px",border:"none",borderRadius:9,background:entrando?accentSoft:accent,color:entrando?inkSoft:"#fff",fontFamily:sans,fontWeight:800,cursor:entrando?"default":"pointer"}}>
          {entrando ? "Entrando..." : "Entrar"}
        </button>
      </div>
    </div>
  );
}

function InstrucoesInicio({ permissoes }) {
  const instrucoes = {
    estoque: ["Estoque inicial do dia", <>Quantidade disponível de cada item no início da operação <b>(deve ser digitada manualmente todos os dias)</b>.</>],
    entradas: ["Entradas", <>Quantidade de cada item que chegou no estoque naquele dia <b>(deve ser digitada manualmente nos dias que chegarem itens no estoque)</b>.<div style={{marginTop:6,fontWeight:800,color:danger}}>É NECESSÁRIO ANEXO DE COMPROVANTE PARA CONFIRMAR ENTRADAS.</div></>],
    perdas: ["Perdas", <>Todos os itens do estoque que estragarem, sumirem ou não estiverem em condições de uso e forem descartados devem ser adicionados manualmente aqui.</>],
    financeiro: ["Vendas", <>As vendas do dia só podem ser importadas diretamente do PDV, <b>não podendo ser digitadas manualmente</b>.</>],
    historico: ["Histórico", <>Consulte as alterações registradas no sistema para acompanhar os lançamentos realizados.</>]
  };
  const ids = ["estoque","entradas","perdas","financeiro","historico"].filter(id=>permissoes.includes(id));

  return (
    <div style={{flex:1,minHeight:0,overflowY:"auto",padding:"18px 16px 22px",boxSizing:"border-box"}}>
      <div style={{fontFamily:sansArredondado,fontWeight:800,fontSize:18,color:ink,marginBottom:14,textAlign:"center"}}>Como utilizar o sistema</div>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {ids.map(id => <div key={id} style={{background:id==="estoque"?accentSoft:"#F7F2EC",border:`1px solid ${line}`,borderRadius:12,padding:"12px 13px"}}>
          <div style={{fontFamily:sansArredondado,fontWeight:800,fontSize:13.5,color:accent,marginBottom:5}}>{instrucoes[id][0]}</div>
          <div style={{fontFamily:sans,fontSize:11.5,lineHeight:1.45,color:ink}}>{instrucoes[id][1]}</div>
        </div>)}
      </div>
    </div>
  );
}

function App() {
  const [usuario, setUsuario] = useState(null);
  const [tab, setTab] = useState(null);
  const [carregandoSessao, setCarregandoSessao] = useState(true);

  useEffect(() => {
    let ativo = true;

    sb.auth.getSession().then(async ({ data }) => {
      if (!ativo) return;
      if (data?.session) {
        const perfil = await carregarPerfilAtual(data.session);
        if (ativo && perfil) setUsuario(perfil);
      }
      if (ativo) setCarregandoSessao(false);
    });

    const { data: listener } = sb.auth.onAuthStateChange(async (_event, session) => {
      if (!ativo) return;
      if (!session) {
        setUsuario(null);
        setTab(null);
        return;
      }
      const perfil = await carregarPerfilAtual(session);
      if (ativo) setUsuario(perfil);
    });

    return () => {
      ativo = false;
      listener?.subscription?.unsubscribe();
    };
  }, []);

  if (carregandoSessao) {
    return (
      <div style={{minHeight:"100vh",background:bgStripes,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:sans,color:inkSoft}}>
        Carregando...
      </div>
    );
  }

  if (!usuario) return <Login onLogin={dados => { setUsuario(dados); setTab(null); }} />;

  const tabsPermitidas = TABS.filter(t => usuario.permissoes.includes(t.id));

  const sair = async () => {
    await sb.auth.signOut();
    usuarioAtualNome = "";
    setUsuario(null);
    setTab(null);
  };

  return (
    <>
      <CicloAutomaticoGlobal />
      <SupabasePainel />
      <div style={{minHeight:"100vh",background:bgStripes,display:"flex",flexDirection:"column",alignItems:"center",padding:"24px 0",fontFamily:sans}}>
        <div style={{width:390,maxWidth:"100%",background:card,borderRadius:20,border:`1px solid ${line}`,boxShadow:"0 16px 40px rgba(59,42,30,0.18)",overflow:"hidden",display:"flex",flexDirection:"column",height:720,flexShrink:0}}>
          <div style={{flex:1,display:"flex",overflow:"hidden"}}>
            <div style={{width:96,flexShrink:0,background:accentSoft,padding:"14px 8px",display:"flex",flexDirection:"column",gap:10,overflowY:"auto"}}>
              {tabsPermitidas.map(t => <button key={t.id} onClick={()=>setTab(t.id)} style={{border:tab===t.id?"1px solid #5A341C":`1.5px solid ${line}`,borderRadius:14,padding:"12px 4px",cursor:"pointer",aspectRatio:"1 / 1",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:5,background:tab===t.id?"linear-gradient(135deg,#5A341C,#7A4A22)":card,color:tab===t.id?"#fff":accent,boxShadow:tab===t.id?"0 4px 10px rgba(90,52,28,0.45)":"0 1px 3px rgba(59,42,30,0.08)"}}>
                <Icon name={t.icone} size={18} color={tab===t.id?"#fff":accent} />
                <span style={{fontFamily:sansArredondado,fontWeight:800,fontSize:13.5,lineHeight:1.2,textAlign:"center"}}>{t.label}</span>
              </button>)}
            </div>
            <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
              <div style={{padding:"16px 16px 10px 20px"}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>
                  <div>
                    <div style={{fontFamily:sansArredondado,fontWeight:800,fontSize:18,color:ink,marginBottom:2}}>Fofíssimo Controle</div>
                    <div style={{fontFamily:sans,fontSize:10.5,color:inkSoft}}>Usuário: <b>{usuario.nome}</b></div>
                  </div>
                  <button onClick={sair} style={{border:`1px solid ${line}`,borderRadius:8,background:card,color:accent,padding:"6px 8px",fontFamily:sans,fontSize:10.5,fontWeight:800,cursor:"pointer"}}>Sair</button>
                </div>
              </div>
              <div key={tab||"inicio"} className={tab?"tab-fan-enter":""} style={{flex:1,overflowY:"auto",display:"flex",flexDirection:"column"}}>
                {!tab && <InstrucoesInicio permissoes={usuario.permissoes} />}
                {tab==="estoque" && <Estoque dataInicial={hojeStr()} />}
                {tab==="entradas" && <EntradasProtegido dataInicial={hojeStr()} />}
                {tab==="perdas" && <PerdasProtegido dataInicial={hojeStr()} />}
                {tab==="financeiro" && <Financeiro dataInicial={hojeStr()} />}
                {tab==="confronto" && <Confronto />}
                {tab==="historico" && <HistoricoAlteracoes />}
              </div>
            </div>
          </div>
        </div>
      </div>
    </>
  );
}

document.getElementById("root").dataset.rendered = "1";
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
