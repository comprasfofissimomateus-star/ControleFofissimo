  html, body { margin: 0; padding: 0; }
  * { box-sizing: border-box; }

  .sparkle-particle {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #E8A33D;
    opacity: 0;
    pointer-events: none;
    animation: sparkle-pop 0.55s ease-out forwards;
  }
  @keyframes sparkle-pop {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(0.3); }
    55% { opacity: 1; }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1); }
  }

  .battle-stage {
    position: relative;
    height: 66px;
    border-radius: 12px;
    overflow: hidden;
    background: repeating-linear-gradient(135deg, #FFFFFF 0px, #FFFFFF 10px, #F3E9DB 10px, #F3E9DB 20px);

  .bolinho-fighter {
    position: absolute;
    top: 50%;
    width: 34px;
    height: 34px;
    margin-top: -17px;
  }
  .bolinho-fighter.left { left: 6%; animation: charge-left 0.9s ease-in-out infinite; }
  .bolinho-fighter.right { right: 6%; animation: charge-right 0.9s ease-in-out infinite; }
  @keyframes charge-left {
    0%, 100% { transform: translateX(0) rotate(-4deg); }
    50% { transform: translateX(13px) rotate(6deg); }
  }
  @keyframes charge-right {
    0%, 100% { transform: translateX(0) rotate(4deg); }
    50% { transform: translateX(-13px) rotate(-6deg); }
  }
  .confrontar-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 72%;
    padding: 12px 0;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #6B4226, #8A5A26);
    color: #fff;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 0.4px;
    cursor: pointer;

  .confrontar-btn:disabled { opacity: 0.75; cursor: default; }
  .confrontar-btn:active:not(:disabled) { transform: translate(-50%, -50%) scale(0.97); }

  .tab-fan-enter {
    position: relative;
    overflow: hidden;
    animation: tabSwipeIn 0.42s cubic-bezier(0.22, 1, 0.36, 1) both;

    width: 14px;

function hojeStr() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}
function ontemStr() {
  const d = new Date(Date.now() - 24 * 60 * 60 * 1000);
  return d.toISOString().slice(0, 10);
}
function amanhaStr() {
  const d = new Date(Date.now() + 24 * 60 * 60 * 1000);
  return d.toISOString().slice(0, 10);
}
function ehDataPassada(data) {
  return data < hojeStr();

function formatarData(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  return `${d}/${m}`;
}
function formatarDataHora(ts) {
  const d = new Date(ts);
  return d.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
}

function normalizarTexto(txt) {
  return (txt || "")
    .toString()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .trim();
}
function normalizarChave(txt) {
  return normalizarTexto(txt).replace(/[^a-z0-9]/g, "");
}

async function lerArquivoPlanilha(file) {
  const buffer = await file.arrayBuffer();
  const wb = XLSX.read(buffer, { type: "array" });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
}

// Procura, nas primeiras linhas, a linha de cabeçalho com as colunas "produto" e "numvendas"
function encontrarColunasPDV(linhas) {
  for (let i = 0; i < Math.min(linhas.length, 6); i++) {
    const linha = linhas[i] || [];
    let colProduto = -1, colQtd = -1;
    linha.forEach((c, idx) => {
      const chave = normalizarChave(c);
      if (colProduto === -1 && chave.includes("produto")) colProduto = idx;
      if (colQtd === -1 && chave.includes("numvendas")) colQtd = idx;
    });
    if (colProduto !== -1 && colQtd !== -1) return { headerRow: i, colProduto, colQtd };
  }
  return null;
}

// Modo genérico: procura a coluna de quantidade dando prioridade a "num vendas" / "vendas"
// antes de cair em termos genéricos como "quantidade", que podem se referir a outra coisa na planilha
function encontrarColunaQuantidadeGenerica(linhas) {
  const gruposPrioridade = [
    ["numvendas"],
    ["vendas"],
    ["qtd", "quantidade", "qtde", "quant", "unid"],
  ];
  for (const grupo of gruposPrioridade) {
    for (let i = 0; i < Math.min(linhas.length, 5); i++) {
      const linha = linhas[i] || [];
      for (let c = 0; c < linha.length; c++) {
        const norm = normalizarChave(linha[c]);
        if (grupo.some((p) => norm.includes(p))) return c;
      }
    }
  }
  return null;
}

// Lê as linhas da planilha e tenta casar cada item cadastrado com uma linha,
// usando as colunas "produto" e "numvendas" quando existem; senão cai no modo genérico
function processarPlanilhaPDV(linhas) {
  const resultado = {};
  ITEMS.forEach((item) => { resultado[item.id] = null; });

  const colunas = encontrarColunasPDV(linhas);

  if (colunas) {
    for (let i = colunas.headerRow + 1; i < linhas.length; i++) {
      const linha = linhas[i] || [];
      const nomeProduto = normalizarTexto(linha[colunas.colProduto]);
      if (!nomeProduto) continue;
      const qtdRaw = linha[colunas.colQtd];
      const qtd = typeof qtdRaw === "number" ? qtdRaw : parseFloat(qtdRaw);
      if (isNaN(qtd)) continue;
      ITEMS.forEach((item) => {
        const nomeItem = normalizarTexto(item.nome);
        if (nomeProduto.includes(nomeItem) || nomeItem.includes(nomeProduto)) {
          resultado[item.id] = (resultado[item.id] || 0) + qtd;
        }
      });
    }
    return resultado;
  }

  // Modo genérico (planilha sem as colunas "produto"/"numvendas" reconhecíveis)
  const colQtd = encontrarColunaQuantidadeGenerica(linhas);
  linhas.forEach((linhaBruta) => {
    const linha = linhaBruta || [];
    const textosLinha = linha.map((c) => normalizarTexto(c));
    ITEMS.forEach((item) => {
      const nomeItem = normalizarTexto(item.nome);
      const bateu = textosLinha.some((t) => t.length > 2 && (t.includes(nomeItem) || nomeItem.includes(t)));
      if (!bateu) return;
      let qtd = null;
      if (colQtd !== null && typeof linha[colQtd] === "number") {
        qtd = linha[colQtd];
      } else {
        for (const c of linha) {
          if (typeof c === "number") { qtd = c; break; }
        }
      }
      if (qtd !== null) resultado[item.id] = (resultado[item.id] || 0) + qtd;
    });
  });
  return resultado;
}

// Busca todos os registros de um tipo para uma data, já preenchendo os itens sem registro com 0
async function buscarRegistros(tipo, data) {
  const { data: rows, error } = await sb
    .from("registros")
    .select("*")
    .eq("tipo", tipo)
    .eq("data", data);
  const base = Object.fromEntries(ITEMS.map((i) => [i.id, tipo === "entrada" ? { qtd: 0, foto: null, nomeArquivo: null } : 0]));
  if (error || !rows) return { base, error: !!error };
  rows.forEach((r) => {
    if (tipo === "entrada") {
      base[r.item_id] = { qtd: r.quantidade, foto: r.foto_url, nomeArquivo: r.nome_arquivo };
    } else {
      base[r.item_id] = r.quantidade;
    }
  });
  return { base, error: false };
}

async function salvarRegistro({ item_id, data, tipo, quantidade, foto_url, nome_arquivo }) {
  const payload = { item_id, data, tipo, quantidade };
  if (foto_url !== undefined) payload.foto_url = foto_url;
  if (nome_arquivo !== undefined) payload.nome_arquivo = nome_arquivo;
  const { error } = await sb
    .from("registros")
    .upsert(payload, { onConflict: "item_id,data,tipo" });
  if (!error) {
    await sb.from("alteracoes").insert({
      aba: abaDoTipo(tipo),
      item_id,
      data,
      quantidade,
      usuario_nome: obterUsuarioNome() || "Não informado",
    });
  }
  return !error;
}

function SparkleBurst({ triggerKey }) {
  if (!triggerKey) return null;
  const n = 6;
  return (
    <span key={triggerKey} style={{ position: "absolute", inset: 0, pointerEvents: "none" }}>
      {Array.from({ length: n }).map((_, i) => {
        const angle = (i / n) * Math.PI * 2;
        const dist = 16 + (i % 2) * 6;
        const dx = Math.cos(angle) * dist;
        const dy = Math.sin(angle) * dist;
        return (
          <span key={i} className="sparkle-particle"
            style={{ left: "50%", top: "50%", "--dx": `${dx}px`, "--dy": `${dy}px`, animationDelay: `${i * 0.02}s` }} />
        );
      })}
    </span>
  );
}

function ContadorRow({ nome, valor, onChange, iconId, bloqueado }) {
  const [burst, setBurst] = useState(0);
  const mudar = (novoValor) => {
    if (bloqueado) return;
    onChange(novoValor);
    setBurst((b) => b + 1);
  };
  return (
    <div style={{ background: card, border: `1px solid ${line}`, borderRadius: 10, padding: "12px 14px", display: "flex", justifyContent: "space-between", alignItems: "center", opacity: bloqueado ? 0.6 : 1 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        <ItemIcon id={iconId} />
        <span style={{ fontFamily: sans, fontWeight: 600, fontSize: 14.5, color: ink }}>{nome}</span>
      </div>
      <div style={{ position: "relative", display: "flex", alignItems: "center", gap: 10 }}>
        <SparkleBurst triggerKey={burst} />
        <button onClick={() => mudar(Math.max(0, valor - 1))} disabled={bloqueado} style={{ ...btnStep, cursor: bloqueado ? "default" : "pointer" }}><Icon name="minus" size={14} /></button>
        <input type="number" value={valor} readOnly={bloqueado} disabled={bloqueado}
          onChange={(e) => mudar(Math.max(0, parseInt(e.target.value || "0", 10)))}
          style={{ width: 48, textAlign: "center", fontFamily: sans, fontWeight: 700, fontSize: 15, border: `1px solid ${line}`, borderRadius: 6, padding: "5px 2px", color: ink }} />
        <button onClick={() => mudar(valor + 1)} disabled={bloqueado} style={{ ...btnStep, cursor: bloqueado ? "default" : "pointer" }}><Icon name="plus" size={14} /></button>

function useDiaCarregado(tipo, dataInicial) {
  const [data, setData] = useState(dataInicial);
  const [valores, setValores] = useState(() => Object.fromEntries(ITEMS.map((i) => [i.id, tipo === "entrada" ? { qtd: 0, foto: null, nomeArquivo: null } : 0])));
  const [carregando, setCarregando] = useState(true);
  const [erro, setErro] = useState(false);

  useEffect(() => {
    let ativo = true;
    setCarregando(true);
    buscarRegistros(tipo, data).then((res) => {
      if (!ativo) return;
      setValores(res.base);
      setErro(res.error);
      setCarregando(false);
    });
    return () => { ativo = false; };
  }, [tipo, data]);

  return { data, setData, valores, setValores, carregando, erro };
}

  const bloqueado = ehDataPassada(data);
  const fileInputRef = useRef(null);
  const [importando, setImportando] = useState(false);
  const [resumoImport, setResumoImport] = useState(null);

  const mudar = async (id, v) => {
    if (bloqueado) return;
    setValores((prev) => ({ ...prev, [id]: v }));
    await salvarRegistro({ item_id: id, data, tipo: "venda", quantidade: v });
  };

  const importarArquivo = async (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file || bloqueado) return;
    setImportando(true);
    setResumoImport(null);
    try {
      const linhas = await lerArquivoPlanilha(file);
      const resultado = processarPlanilhaPDV(linhas);
      // Zera todos os produtos antes de aplicar o novo arquivo importado
      for (const item of ITEMS) {
        await mudar(item.id, 0);
      }
      const encontrados = [];
      const naoEncontrados = [];
      for (const item of ITEMS) {
        if (resultado[item.id] !== null) {
          await mudar(item.id, resultado[item.id]);
          encontrados.push(`${item.nome}: ${resultado[item.id]}`);
        } else {
          naoEncontrados.push(item.nome);
        }
      }
      setResumoImport({ ok: true, encontrados, naoEncontrados });
    } catch (err) {
      setResumoImport({ ok: false, texto: "Não foi possível ler o arquivo. Confira se é um .xlsx válido." });
    }
    setImportando(false);
  };

  return (
    <div style={{ padding: 16, display: "flex", flexDirection: "column", gap: 10 }}>
      <DateBar data={data} setData={setData} />

      <input ref={fileInputRef} type="file" accept=".xlsx,.xls" onChange={importarArquivo} style={{ display: "none" }} />

        {importando ? "Importando..." : "Importar PDV"}

      {resumoImport && !importando && (
        <div style={{ fontFamily: sans, fontSize: 11.5, color: resumoImport.ok ? ink : danger, background: resumoImport.ok ? accentSoft : dangerSoft, borderRadius: 8, padding: "8px 10px" }}>
          {resumoImport.ok ? (
            <>

              {resumoImport.naoEncontrados.length > 0 && <div style={{ color: danger, marginTop: 2 }}>Não encontrado na planilha: {resumoImport.naoEncontrados.join(", ")}</div>}

      <div style={{ display: "flex", alignItems: "center", gap: 6, color: inkSoft, fontFamily: sans, fontSize: 11, justifyContent: "center", textAlign: "center" }}>

function UltimoConfronto({ recarregarChave }) {
  const [grupo, setGrupo] = useState(null);
  const [carregando, setCarregando] = useState(true);
  const [erro, setErro] = useState(false);

  useEffect(() => {
    let ativo = true;
    setCarregando(true);
    sb
      .from("confrontos")
      .select("*")
      .order("executado_em", { ascending: false })
      .limit(ITEMS.length)

const amarelo = "#B8860B";
const amareloSoft = "#FBF3D9";
const verdeSoft = "#E7F3E9";

function EstoqueEsperadoDia() {
  const [carregando, setCarregando] = useState(false);
  const [resultado, setResultado] = useState(() => {
    try {
      const salvo = localStorage.getItem("estoqueEsperadoDia");
      return salvo ? JSON.parse(salvo) : null;
    } catch (e) {
      return null;
    }
  });
  const [erro, setErro] = useState(false);

  useEffect(() => {
    calcular();
    const timer = setInterval(calcular, 2000);
    return () => clearInterval(timer);
  }, []);

  const calcular = async () => {
    setCarregando(true);
    setErro(false);
    const hoje = hojeStr();
    try {
      const [inicialRes, entradasRes, perdasRes, vendasRes] = await Promise.all([
        sb.from("registros").select("item_id, quantidade").eq("tipo", "contagem").eq("data", hoje),
        sb.from("registros").select("item_id, quantidade").eq("tipo", "entrada").eq("data", hoje),
        sb.from("registros").select("item_id, quantidade").eq("tipo", "perda").eq("data", hoje),
        sb.from("registros").select("item_id, quantidade").eq("tipo", "venda").eq("data", hoje),
        new Promise((r) => setTimeout(r, 600)),
      ]);
      if (inicialRes.error || entradasRes.error || perdasRes.error || vendasRes.error) {
        throw new Error("erro");
      }
      const mapa = Object.fromEntries(ITEMS.map((i) => [i.id, 0]));
      (inicialRes.data || []).forEach((r) => { mapa[r.item_id] += r.quantidade; });
      (entradasRes.data || []).forEach((r) => { mapa[r.item_id] += r.quantidade; });
      (perdasRes.data || []).forEach((r) => { mapa[r.item_id] -= r.quantidade; });
      (vendasRes.data || []).forEach((r) => { mapa[r.item_id] -= r.quantidade; });
      setResultado(mapa);
      try {
        localStorage.setItem("estoqueEsperadoDia", JSON.stringify(mapa));
      } catch (e) {}
    } catch (e) {
      setErro(true);
      // Mantém o último cálculo exibido até que uma nova requisição seja concluída com sucesso.
    }
    setCarregando(false);
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
      <div style={{
        display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
        background: accent, color: "#fff", border: "none", borderRadius: 10, padding: "11px 0",
        fontFamily: sans, fontWeight: 700, fontSize: 13.5,
        opacity: carregando ? 0.85 : 1,
      }}>
        {carregando && <span className="spinner-simple" />}
        {carregando ? "Calculando..." : `Estoque esperado do dia ${formatarData(amanhaStr())}`}
      </div>

      {erro && (
        <div style={{ fontFamily: sans, fontSize: 11.5, color: danger, textAlign: "center" }}>
          Não foi possível calcular o estoque esperado.
        </div>
      )}

      {resultado && !carregando && (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {ITEMS.map((item) => {
            const v = resultado[item.id];
            const cor = v > 0 ? good : v === 0 ? amarelo : danger;
            const corBg = v > 0 ? verdeSoft : v === 0 ? amareloSoft : dangerSoft;
            return (
              <div key={item.id} style={{ background: corBg, border: `1px solid ${line}`, borderRadius: 10, padding: "10px 14px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <ItemIcon id={item.id} />
                  <span style={{ fontFamily: sans, fontWeight: 600, fontSize: 14, color: ink }}>{item.nome}</span>
                </div>
                <span style={{ fontFamily: sans, fontWeight: 800, fontSize: 16, color: cor }}>{v}</span>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function Confronto() {
  const [rodando, setRodando] = useState(false);
  const [progresso, setProgresso] = useState(0);
  const [etapaTexto, setEtapaTexto] = useState("");
  const [msgFinal, setMsgFinal] = useState(null);
  const [recarregarChave, setRecarregarChave] = useState(0);
  const [pedirSenha, setPedirSenha] = useState(false);

  const iniciarConfronto = () => {
    if (rodando) return;
    setPedirSenha(true);
  };

  const confrontarAgora = () => {
    setMsgFinal(null);
    setRodando(true);
    setProgresso(0);
    let passo = 0;
    const proximo = async () => {
      if (passo >= ETAPAS_CONFRONTO.length) {
        try {
          const hoje = hojeStr();

          const [inicialRes, entradasRes, perdasRes, vendasRes] = await Promise.all([
            sb.from("registros").select("item_id, quantidade").eq("tipo", "contagem").eq("data", hoje),
            sb.from("registros").select("item_id, quantidade").eq("tipo", "entrada").eq("data", hoje),
            sb.from("registros").select("item_id, quantidade").eq("tipo", "perda").eq("data", hoje),
            sb.from("registros").select("item_id, quantidade").eq("tipo", "venda").eq("data", hoje),
          ]);
          if (inicialRes.error || entradasRes.error || perdasRes.error || vendasRes.error) {
            throw new Error("Não foi possível ler os dados do banco.");
          }

          const estoqueInicial = Object.fromEntries(ITEMS.map((i) => [i.id, 0]));
          (inicialRes.data || []).forEach((r) => { estoqueInicial[r.item_id] = r.quantidade; });

          const estoqueAtual = Object.fromEntries(ITEMS.map((i) => [i.id, 0]));
          (entradasRes.data || []).forEach((r) => { estoqueAtual[r.item_id] += r.quantidade; });
          (perdasRes.data || []).forEach((r) => { estoqueAtual[r.item_id] -= r.quantidade; });
          (vendasRes.data || []).forEach((r) => { estoqueAtual[r.item_id] -= r.quantidade; });

          const executadoEm = new Date().toISOString();
          const linhas = ITEMS.map((item) => {
            const inicial = estoqueInicial[item.id];
            const atual = estoqueAtual[item.id];
            const diferenca = atual - inicial;
            return {
              data_referencia: hoje,
              executado_em: executadoEm,
              item_id: item.id,
              status: diferenca !== 0 ? "alerta" : "ok",
              estoque_esperado: inicial,
              estoque_contado: atual,
              diferenca,
            };
          });

          const { error: erroInsert } = await sb.from("confrontos").insert(linhas);
          if (erroInsert) throw new Error(erroInsert.message);

          const temInconsistencia = linhas.some((l) => l.status === "alerta");
          setMsgFinal({
            ok: true,
            texto: temInconsistencia ? "Confronto concluído: foram encontradas inconsistências." : "Confronto concluído: tudo bate certinho.",
          });
        } catch (e) {
          setMsgFinal({ ok: false, texto: "Erro: " + (e && e.message ? e.message : String(e)) });
        }
        setRodando(false);
        setRecarregarChave((k) => k + 1);
        return;
      }
      setEtapaTexto(ETAPAS_CONFRONTO[passo]);
      setProgresso(Math.round(((passo + 1) / ETAPAS_CONFRONTO.length) * 100));
      passo++;
      setTimeout(proximo, 450);
    };
    proximo();
  };

  return (
    <div style={{ padding: 16, display: "flex", flexDirection: "column", gap: 12 }}>
      <EstoqueEsperadoDia />

      <div style={{ height: 1, background: line, margin: "2px 0" }} />

      <div className="battle-stage">
        <div className="bolinho-fighter left"><BolinhoFighter mirrored={false} /></div>
        <div className="bolinho-fighter right"><BolinhoFighter mirrored={true} /></div>
        <button className="confrontar-btn" onClick={iniciarConfronto} disabled={rodando}>
          {rodando ? "Analisando..." : "⚔ Confrontar agora"}
        </button>
      </div>

      {pedirSenha && !rodando && (
        <div style={{
          position: "fixed", inset: 0, zIndex: 100, background: "rgba(59,42,30,0.35)",
          display: "flex", alignItems: "center", justifyContent: "center", padding: 20
        }}>
          <div style={{
            width: "min(320px, 100%)", background: card, border: `1px solid ${line}`,
            borderRadius: 14, boxShadow: "0 16px 40px rgba(59,42,30,0.25)"
          }}>
            <SenhaGate
              titulo="Digite a senha para realizar o confronto"
              senhaCerta={SENHA_GERAL}
              onEntrar={() => { setPedirSenha(false); confrontarAgora(); }}
            />
            <button onClick={() => setPedirSenha(false)} style={{
              display: "block", margin: "-4px auto 14px", background: "transparent",
              border: "none", color: inkSoft, fontFamily: sans, fontSize: 12,
              cursor: "pointer"
            }}>Cancelar</button>
          </div>
        </div>
      )}

      {rodando && (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          <div style={{ fontFamily: sans, fontSize: 12, color: inkSoft, textAlign: "center" }}>{etapaTexto}</div>
          <div style={{ width: "100%", height: 8, background: accentSoft, borderRadius: 99, overflow: "hidden" }}>
            <div style={{ width: `${progresso}%`, height: "100%", background: accent, borderRadius: 99, transition: "width 0.5s ease" }} />
          </div>
        </div>
      )}

      {msgFinal && !rodando && (
        <div style={{ fontFamily: sans, fontWeight: 700, fontSize: 12.5, color: msgFinal.ok ? good : danger, textAlign: "center" }}>
          {msgFinal.texto}
        </div>
      )}

      <div style={{ fontFamily: sans, fontWeight: 800, fontSize: 13.5, color: ink }}>Último confronto</div>
      <UltimoConfronto recarregarChave={recarregarChave} />

      <div style={{ fontFamily: sans, fontSize: 10.5, color: inkSoft, textAlign: "center" }}>
        Compara o estoque atual (entradas − perdas − vendas de hoje) com o estoque inicial do dia.
      </div>
    </div>
  );
}

const TABS = [
  { id: "estoque", label: "Estoque inicial do dia", icone: "tabEstoque" },
  { id: "entradas", label: "Entradas", icone: "tabEntradas" },
  { id: "perdas", label: "Perdas", icone: "tabPerdas" },
  { id: "financeiro", label: "Vendas", icone: "tabVendas" },
  { id: "confronto", label: "Confronto", icone: "tabConfronto" },
  { id: "historico", label: "Histórico", icone: "historico" },
];

function HistoricoAlteracoes() {
  const [linhas, setLinhas] = useState([]);
  const [carregando, setCarregando] = useState(true);
  const [erro, setErro] = useState(false);

  useEffect(() => {
    let ativo = true;
    sb
      .from("alteracoes")
      .select("*")
      .order("criado_em", { ascending: false })
      .limit(300)
      .then(({ data, error }) => {
        if (!ativo) return;
        if (error || !data) { setErro(true); setCarregando(false); return; }
        setLinhas(data);
        setCarregando(false);
      });
    return () => { ativo = false; };
  }, []);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 8, padding: 16, overflowY: "auto", flex: 1 }}>
      {carregando && <div style={{ fontFamily: sans, fontSize: 12, color: inkSoft, textAlign: "center" }}>Carregando...</div>}
      {erro && <div style={{ fontFamily: sans, fontSize: 11.5, color: danger, textAlign: "center" }}>Não foi possível carregar o histórico.</div>}
      {!carregando && !erro && linhas.length === 0 && (
        <div style={{ fontFamily: sans, fontSize: 12, color: inkSoft, textAlign: "center" }}>Nenhuma alteração registrada ainda.</div>
      )}
      {linhas.map((l) => (
        <div key={l.id} style={{ background: card, border: `1px solid ${line}`, borderRadius: 8, padding: "9px 12px", display: "flex", flexDirection: "column", gap: 2 }}>
          <div style={{ display: "flex", justifyContent: "space-between", fontFamily: sans, fontSize: 12, fontWeight: 700, color: ink }}>
            <span>{l.aba} · {nomeDoItem(l.item_id)}</span>
            <span style={{ color: inkSoft, fontWeight: 600 }}>{formatarDataHora(l.criado_em)}</span>
          </div>
          <div style={{ fontFamily: sans, fontSize: 11.5, color: inkSoft }}>
            Referente a {formatarData(l.data)} — novo valor: <b style={{ color: ink }}>{l.quantidade}</b>
          </div>
          <div style={{ fontFamily: sans, fontSize: 11.5, color: inkSoft }}>
            Usuário: <b style={{ color: ink }}>{l.usuario_nome || "Não informado"}</b>
          </div>
        </div>
      ))}
    </div>
  );
}

function App() {
  const [tab, setTab] = useState("estoque");
  const [usuarioNome, setUsuarioNome] = useState(() => obterUsuarioNome());

  const mudarUsuario = (valor) => {
    setUsuarioNome(valor);
    salvarUsuarioNome(valor);
  };

  return (
    <div style={{ minHeight: "100vh", background: bgStripes, display: "flex", flexDirection: "column", alignItems: "center", padding: "24px 0", fontFamily: sans }}>
      <div style={{ width: 390, maxWidth: "100%", background: card, borderRadius: 20, border: `1px solid ${line}`, boxShadow: "0 16px 40px rgba(59,42,30,0.18)", overflow: "hidden", display: "flex", flexDirection: "column", height: 720, flexShrink: 0 }}>
        <div style={{ flex: 1, display: "flex", overflow: "hidden" }}>
          <div style={{ width: 96, flexShrink: 0, background: accentSoft, padding: "14px 8px", display: "flex", flexDirection: "column", gap: 10, overflowY: "auto" }}>
            {TABS.map((t) => (
              <button key={t.id} onClick={() => setTab(t.id)} style={{
                border: tab === t.id ? "1px solid #5A341C" : `1.5px solid ${line}`,
                borderRadius: 14, padding: "12px 4px", cursor: "pointer",
                aspectRatio: "1 / 1",
                display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 5,
                background: tab === t.id ? "linear-gradient(135deg, #5A341C, #7A4A22)" : card,
                color: tab === t.id ? "#fff" : accent,
                boxShadow: tab === t.id ? "0 4px 10px rgba(90,52,28,0.45)" : "0 1px 3px rgba(59,42,30,0.08)",
                transition: "background 0.2s ease, box-shadow 0.2s ease, border 0.2s ease",
              }}>
                <Icon name={t.icone} size={18} color={tab === t.id ? "#fff" : accent} />
                <span style={{ fontFamily: sansArredondado, fontWeight: 800, fontSize: 13.5, lineHeight: 1.2, textAlign: "center" }}>{t.label}</span>
              </button>
            ))}
          </div>

          <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
            <div style={{ padding: "16px 16px 10px 20px" }}>
              <div style={{ fontFamily: sansArredondado, fontWeight: 800, fontSize: 18, color: ink, marginBottom: 2 }}>Fofíssimo Controle</div>
              <div style={{ display: "flex", alignItems: "center", gap: 7, marginTop: 5 }}>
                <span style={{ fontFamily: sans, fontSize: 10.5, color: inkSoft, flexShrink: 0 }}>Usuário:</span>
                <input
                  value={usuarioNome}
                  onChange={(e) => mudarUsuario(e.target.value)}
                  placeholder="Digite seu nome"
                  aria-label="Nome do usuário"
                  style={{ minWidth: 0, flex: 1, border: `1px solid ${line}`, borderRadius: 7, padding: "5px 7px", fontFamily: sans, fontSize: 11, color: ink, background: bg }}
                />
              </div>
              <div style={{ fontFamily: sans, fontSize: 10, color: inkSoft, marginTop: 3 }}>Alterações ficam salvas com o nome informado.</div>
            </div>

            <div key={tab} className="tab-fan-enter" style={{ flex: 1, overflowY: "auto", display: "flex", flexDirection: "column" }}>
              {tab === "estoque" && <Estoque dataInicial={hojeStr()} />}
              {tab === "entradas" && <EntradasProtegido dataInicial={hojeStr()} />}
              {tab === "perdas" && <PerdasProtegido dataInicial={hojeStr()} />}
              {tab === "financeiro" && <Financeiro dataInicial={hojeStr()} />}
              {tab === "confronto" && <Confronto />}
              {tab === "historico" && <HistoricoAlteracoes />}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

document.getElementById("root").dataset.rendered = "1";
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
