<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fofíssimo Controle</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useRef } = React;

const ink = "#3B2A1E", inkSoft = "#8A7462";
const bgStripes = "repeating-linear-gradient(135deg, #FFFFFF 0px, #FFFFFF 18px, #F3E9DB 18px, #F3E9DB 36px)";
const card = "#FFFFFF", line = "#DCC9B2";
const accent = "#6B4226", accentSoft = "#EFE0CE";
const danger = "#8C3B2E", dangerSoft = "#F3DED8";
const sans = "ui-sans-serif, system-ui, -apple-system, sans-serif";

const ITEMS = [
  { id: "pao-de-queijo", nome: "Pão de queijo" },
  { id: "agua", nome: "Água" },
  { id: "bolinho-nutella", nome: "Bolinho de Nutella" },
  { id: "croissant", nome: "Croissant" },
];

const SENHA_FINANCEIRO = "16273991";
const STORAGE_KEY = "estoque-simples-data";

function defaultEntradas() {
  return Object.fromEntries(ITEMS.map((i) => [i.id, { qtd: 0, foto: null, nomeArquivo: null }]));
}
function defaultCounts() {
  return Object.fromEntries(ITEMS.map((i) => [i.id, 0]));
}
function emptyData() {
  return { estoque: defaultCounts(), entradas: defaultEntradas(), perdas: defaultCounts(), financeiro: defaultCounts() };
}
function normalize(raw) {
  const safe = raw || {};
  const fillCounts = (obj) => Object.fromEntries(ITEMS.map((i) => [i.id, (obj && obj[i.id]) || 0]));
  const fillEntradas = (obj) => Object.fromEntries(ITEMS.map((i) => [i.id, (obj && obj[i.id]) || { qtd: 0, foto: null, nomeArquivo: null }]));
  return {
    estoque: fillCounts(safe.estoque),
    entradas: fillEntradas(safe.entradas || safe.perdas),
    perdas: fillCounts(safe.perdasContagem),
    financeiro: fillCounts(safe.financeiro),
  };
}
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? normalize(JSON.parse(raw)) : emptyData();
  } catch (e) {
    return emptyData();
  }
}
function saveData(data) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    return true;
  } catch (e) {
    return false;
  }
}

function Icon({ name, size = 16, color = "currentColor" }) {
  const paths = {
    plus: "M12 5v14 M5 12h14",
    minus: "M5 12h14",
    paperclip: "M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48",
    trash: "M3 6h18 M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2 M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6",
  };
  if (name === "lock") {
    return (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" />
        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
      </svg>
    );
  }
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      {paths[name].split(" M").map((seg, i) => (
        <path key={i} d={i === 0 ? seg : "M" + seg} />
      ))}
    </svg>
  );
}

const btnStep = {
  width: 30, height: 30, borderRadius: 7, border: `1px solid ${line}`, background: "#fff",
  display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", color: ink,
};

function ContadorRow({ nome, valor, onChange }) {
  return (
    <div style={{ background: card, border: `1px solid ${line}`, borderRadius: 10, padding: "12px 14px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
      <span style={{ fontFamily: sans, fontWeight: 600, fontSize: 14.5, color: ink }}>{nome}</span>
      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
        <button onClick={() => onChange(Math.max(0, valor - 1))} style={btnStep}><Icon name="minus" size={14} /></button>
        <input type="number" value={valor}
          onChange={(e) => onChange(Math.max(0, parseInt(e.target.value || "0", 10)))}
          style={{ width: 48, textAlign: "center", fontFamily: sans, fontWeight: 700, fontSize: 15, border: `1px solid ${line}`, borderRadius: 6, padding: "5px 2px", color: ink }} />
        <button onClick={() => onChange(valor + 1)} style={btnStep}><Icon name="plus" size={14} /></button>
      </div>
    </div>
  );
}

function EntradaRow({ nome, dados, onChangeQtd, onAnexar, onRemoverAnexo }) {
  const fileRef = useRef(null);
  const liberado = !!dados.foto;
  const handleFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => onAnexar(reader.result, file.name);
    reader.readAsDataURL(file);
    e.target.value = "";
  };
  return (
    <div style={{ background: card, border: `1px solid ${line}`, borderRadius: 10, padding: "12px 14px", display: "flex", flexDirection: "column", gap: 10 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <span style={{ fontFamily: sans, fontWeight: 600, fontSize: 14.5, color: ink }}>{nome}</span>
        {liberado && (
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <button onClick={() => onChangeQtd(Math.max(0, dados.qtd - 1))} style={btnStep}><Icon name="minus" size={14} /></button>
            <input type="number" value={dados.qtd}
              onChange={(e) => onChangeQtd(Math.max(0, parseInt(e.target.value || "0", 10)))}
              style={{ width: 48, textAlign: "center", fontFamily: sans, fontWeight: 700, fontSize: 15, border: `1px solid ${line}`, borderRadius: 6, padding: "5px 2px", color: ink }} />
            <button onClick={() => onChangeQtd(dados.qtd + 1)} style={btnStep}><Icon name="plus" size={14} /></button>
          </div>
        )}
      </div>
      {liberado ? (
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <img src={dados.foto} alt="Nota fiscal" style={{ width: 44, height: 44, objectFit: "cover", borderRadius: 6, border: `1px solid ${line}` }} />
          <span style={{ fontFamily: sans, fontSize: 12, color: inkSoft, flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{dados.nomeArquivo}</span>
          <button onClick={onRemoverAnexo} style={{ ...btnStep, color: danger, borderColor: danger }}><Icon name="trash" size={13} /></button>
        </div>
      ) : (
        <>
          <label style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 6, border: `1.5px dashed ${line}`, borderRadius: 8, padding: "9px", cursor: "pointer", color: accent, fontFamily: sans, fontWeight: 600, fontSize: 12.5 }}>
            <Icon name="paperclip" size={14} />
            Anexar nota fiscal
            <input ref={fileRef} type="file" accept="image/*" onChange={handleFile} style={{ display: "none" }} />
          </label>
          <div style={{ display: "flex", alignItems: "center", gap: 6, color: inkSoft, fontFamily: sans, fontSize: 11 }}>
            <Icon name="lock" size={12} />
            Anexe a nota fiscal para liberar a contagem
          </div>
        </>
      )}
    </div>
  );
}

function Contador({ dados, setQtd }) {
  return (
    <div style={{ padding: 16, display: "flex", flexDirection: "column", gap: 10 }}>
      {ITEMS.map((item) => <ContadorRow key={item.id} nome={item.nome} valor={dados[item.id]} onChange={(v) => setQtd(item.id, v)} />)}
    </div>
  );
}

function Entradas({ entradas, setQtd, setFoto, removerFoto }) {
  return (
    <div style={{ padding: 16, display: "flex", flexDirection: "column", gap: 10 }}>
      {ITEMS.map((item) => (
        <EntradaRow key={item.id} nome={item.nome} dados={entradas[item.id]}
          onChangeQtd={(v) => setQtd(item.id, v)}
          onAnexar={(dataUrl, nome) => setFoto(item.id, dataUrl, nome)}
          onRemoverAnexo={() => removerFoto(item.id)} />
      ))}
    </div>
  );
}

function Financeiro({ financeiro, setQtd }) {
  const [senha, setSenha] = useState("");
  const [desbloqueado, setDesbloqueado] = useState(false);
  const [erro, setErro] = useState(false);

  const tentar = () => {
    if (senha === SENHA_FINANCEIRO) { setDesbloqueado(true); setErro(false); }
    else setErro(true);
  };

  if (!desbloqueado) {
    return (
      <div style={{ padding: 16, display: "flex", flexDirection: "column", alignItems: "center", gap: 12, marginTop: 40 }}>
        <div style={{ width: 44, height: 44, borderRadius: 99, background: accentSoft, display: "flex", alignItems: "center", justifyContent: "center", color: accent }}>
          <Icon name="lock" size={20} />
        </div>
        <div style={{ fontFamily: sans, fontWeight: 700, fontSize: 15, color: ink }}>Área protegida</div>
        <input type="password" inputMode="numeric" value={senha}
          onChange={(e) => { setSenha(e.target.value); setErro(false); }}
          onKeyDown={(e) => e.key === "Enter" && tentar()}
          placeholder="Senha"
          style={{ width: 160, textAlign: "center", fontFamily: sans, fontSize: 15, border: `1px solid ${erro ? danger : line}`, borderRadius: 8, padding: "9px" }} />
        {erro && <div style={{ fontFamily: sans, fontSize: 12, color: danger }}>Senha incorreta</div>}
        <button onClick={tentar} style={{ background: accent, color: "#fff", border: "none", borderRadius: 8, padding: "9px 22px", fontFamily: sans, fontWeight: 700, fontSize: 13.5, cursor: "pointer" }}>Entrar</button>
      </div>
    );
  }

  return (
    <div style={{ padding: 16, display: "flex", flexDirection: "column", gap: 10 }}>
      {ITEMS.map((item) => <ContadorRow key={item.id} nome={item.nome} valor={financeiro[item.id]} onChange={(v) => setQtd(item.id, v)} />)}
      <button onClick={() => setDesbloqueado(false)} style={{ marginTop: 4, background: "transparent", border: "none", color: inkSoft, fontFamily: sans, fontSize: 12, cursor: "pointer", textAlign: "center" }}>
        Bloquear novamente
      </button>
    </div>
  );
}

const TABS = [
  { id: "estoque", label: "Estoque" },
  { id: "entradas", label: "Entradas" },
  { id: "perdas", label: "Perdas" },
  { id: "financeiro", label: "Financeiro" },
];

function App() {
  const [tab, setTab] = useState("estoque");
  const [data, setData] = useState(() => loadData());
  const [saveError, setSaveError] = useState(false);

  const persist = (next) => {
    setData(next);
    setSaveError(!saveData(next));
  };

  const setEstoqueQtd = (id, v) => persist({ ...data, estoque: { ...data.estoque, [id]: v } });
  const setEntradaQtd = (id, v) => persist({ ...data, entradas: { ...data.entradas, [id]: { ...data.entradas[id], qtd: v } } });
  const setEntradaFoto = (id, foto, nomeArquivo) => persist({ ...data, entradas: { ...data.entradas, [id]: { ...data.entradas[id], foto, nomeArquivo } } });
  const removerEntradaFoto = (id) => persist({ ...data, entradas: { ...data.entradas, [id]: { qtd: 0, foto: null, nomeArquivo: null } } });
  const setPerdaQtd = (id, v) => persist({ ...data, perdas: { ...data.perdas, [id]: v } });
  const setFinanceiroQtd = (id, v) => persist({ ...data, financeiro: { ...data.financeiro, [id]: v } });

  return (
    <div style={{ minHeight: "100vh", background: bgStripes, display: "flex", justifyContent: "center", padding: "24px 0", fontFamily: sans }}>
      <div style={{ width: 390, maxWidth: "100%", background: card, borderRadius: 20, border: `1px solid ${line}`, boxShadow: "0 16px 40px rgba(59,42,30,0.18)", overflow: "hidden", display: "flex", flexDirection: "column", height: 720 }}>
        <div style={{ padding: "16px 16px 0" }}>
          <div style={{ fontFamily: sans, fontWeight: 800, fontSize: 17, color: ink, marginBottom: 2 }}>Fofíssimo Controle</div>
          <div style={{ fontFamily: sans, fontSize: 10.5, color: inkSoft, marginBottom: 12 }}>Dados salvos neste navegador</div>
          <div style={{ display: "flex", gap: 4, background: accentSoft, borderRadius: 10, padding: 3 }}>
            {TABS.map((t) => (
              <button key={t.id} onClick={() => setTab(t.id)} style={{
                flex: 1, border: "none", borderRadius: 8, padding: "8px 0", cursor: "pointer",
                fontFamily: sans, fontWeight: 700, fontSize: 11.5,
                background: tab === t.id ? accent : "transparent",
                color: tab === t.id ? "#fff" : accent,
              }}>
                {t.label}
              </button>
            ))}
          </div>
        </div>

        <div style={{ flex: 1, overflowY: "auto" }}>
          {tab === "estoque" && <Contador dados={data.estoque} setQtd={setEstoqueQtd} />}
          {tab === "entradas" && <Entradas entradas={data.entradas} setQtd={setEntradaQtd} setFoto={setEntradaFoto} removerFoto={removerEntradaFoto} />}
          {tab === "perdas" && <Contador dados={data.perdas} setQtd={setPerdaQtd} />}
          {tab === "financeiro" && <Financeiro financeiro={data.financeiro} setQtd={setFinanceiroQtd} />}
        </div>

        {saveError && (
          <div style={{ padding: "8px 16px", background: dangerSoft, color: danger, fontFamily: sans, fontSize: 11.5, textAlign: "center" }}>
            Não foi possível salvar a última alteração (armazenamento cheio ou indisponível).
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
