<style>
  html, body { margin: 0; padding: 0; }
  * { box-sizing: border-box; }

  .sparkle-particle {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #E8A33D;
    opacity: 0;
    pointer-events: none;
    animation: sparkle-pop 0.55s ease-out forwards;
  }
  @keyframes sparkle-pop {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(0.3); }
    55% { opacity: 1; }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1); }
  }

  .battle-stage {
    position: relative;
    height: 66px;
    border-radius: 12px;
    overflow: hidden;
    background: repeating-linear-gradient(135deg, #FFFFFF 0px, #FFFFFF 10px, #F3E9DB 10px, #F3E9DB 20px);
    border: 1px solid #DCC9B2;
  }
  .bolinho-fighter {
    position: absolute;
    top: 50%;
    width: 34px;
    height: 34px;
    margin-top: -17px;
  }
  .bolinho-fighter.left { left: 6%; animation: charge-left 0.9s ease-in-out infinite; }
  .bolinho-fighter.right { right: 6%; animation: charge-right 0.9s ease-in-out infinite; }
  @keyframes charge-left {
    0%, 100% { transform: translateX(0) rotate(-4deg); }
    50% { transform: translateX(13px) rotate(6deg); }
  }
  @keyframes charge-right {
    0%, 100% { transform: translateX(0) rotate(4deg); }
    50% { transform: translateX(-13px) rotate(-6deg); }
  }
  .confrontar-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 72%;
    padding: 12px 0;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #6B4226, #8A5A26);
    color: #fff;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 0.4px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(107,66,38,0.35);
    z-index: 2;
  }
  .confrontar-btn:disabled { opacity: 0.75; cursor: default; }
  .confrontar-btn:active:not(:disabled) { transform: translate(-50%, -50%) scale(0.97); }
</style>

function hojeStr() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}
function ontemStr() {
  const d = new Date(Date.now() - 24 * 60 * 60 * 1000);
  return d.toISOString().slice(0, 10);
}
function formatarData(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  return `${d}/${m}`;
}
function formatarDataHora(ts) {
  const d = new Date(ts);
  return d.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
}

// Busca todos os registros de um tipo para uma data, já preenchendo os itens sem registro com 0
async function buscarRegistros(tipo, data) {
  const { data: rows, error } = await sb
    .from("registros")
    .select("*")
    .eq("tipo", tipo)
    .eq("data", data);
  const base = Object.fromEntries(ITEMS.map((i) => [i.id, tipo === "entrada" ? { qtd: 0, foto: null, nomeArquivo: null } : 0]));
  if (error || !rows) return { base, error: !!error };
  rows.forEach((r) => {
    if (tipo === "entrada") {
      base[r.item_id] = { qtd: r.quantidade, foto: r.foto_url, nomeArquivo: r.nome_arquivo };
    } else {
      base[r.item_id] = r.quantidade;
    }
  });
  return { base, error: false };
}

async function salvarRegistro({ item_id, data, tipo, quantidade, foto_url, nome_arquivo }) {
  const payload = { item_id, data, tipo, quantidade };
  if (foto_url !== undefined) payload.foto_url = foto_url;
  if (nome_arquivo !== undefined) payload.nome_arquivo = nome_arquivo;
  const { error } = await sb
    .from("registros")
    .upsert(payload, { onConflict: "item_id,data,tipo" });
  return !error;
}

function Icon({ name, size = 16, color = "currentColor" }) {
  const paths = {

}

function SparkleBurst({ triggerKey }) {
  if (!triggerKey) return null;
  const n = 6;
  return (
    <span key={triggerKey} style={{ position: "absolute", inset: 0, pointerEvents: "none" }}>
      {Array.from({ length: n }).map((_, i) => {
        const angle = (i / n) * Math.PI * 2;
        const dist = 16 + (i % 2) * 6;
        const dx = Math.cos(angle) * dist;
        const dy = Math.sin(angle) * dist;
        return (
          <span key={i} className="sparkle-particle"
            style={{ left: "50%", top: "50%", "--dx": `${dx}px`, "--dy": `${dy}px`, animationDelay: `${i * 0.02}s` }} />
        );
      })}
    </span>
  );
}

      <circle cx="19" cy="17" r="10" fill="#D9A15B" stroke="#8A5A26" strokeWidth="1" />

      <path d="M15.5 19c1.5 1.5 4.5 1.5 6 0" stroke="#3B2A1E" strokeWidth="1" fill="none" strokeLinecap="round" />
      <g transform="translate(25,3) rotate(35)">
        <rect x="-1" y="0" width="2" height="13" fill="#B9C4CC" />
        <rect x="-3" y="11" width="6" height="2" fill="#6B4226" />
        <rect x="-1" y="13" width="2" height="4" fill="#6B4226" />
      </g>
    </svg>
  );
}

const btnStep = {
  width: 30, height: 30, borderRadius: 7, border: `1px solid ${line}`, background: "#fff",
  display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", color: ink,
};

function DateBar({ data, setData }) {
  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: accentSoft, borderRadius: 10, padding: "8px 12px" }}>
      <span style={{ fontFamily: sans, fontSize: 12, fontWeight: 700, color: accent }}>Referente ao dia</span>
      <input type="date" value={data} onChange={(e) => setData(e.target.value)}
        style={{ fontFamily: sans, fontSize: 13, border: `1px solid ${line}`, borderRadius: 6, padding: "4px 6px", background: "#fff", color: ink }} />
    </div>
  );
}

function ContadorRow({ nome, valor, onChange, iconId }) {
  const [burst, setBurst] = useState(0);
  const mudar = (novoValor) => {
    onChange(novoValor);
    setBurst((b) => b + 1);
  };
  return (
    <div style={{ background: card, border: `1px solid ${line}`, borderRadius: 10, padding: "12px 14px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        <ItemIcon id={iconId} />
        <span style={{ fontFamily: sans, fontWeight: 600, fontSize: 14.5, color: ink }}>{nome}</span>
      </div>
      <div style={{ position: "relative", display: "flex", alignItems: "center", gap: 10 }}>
        <SparkleBurst triggerKey={burst} />
        <button onClick={() => mudar(Math.max(0, valor - 1))} style={btnStep}><Icon name="minus" size={14} /></button>
        <input type="number" value={valor}
          onChange={(e) => mudar(Math.max(0, parseInt(e.target.value || "0", 10)))}
          style={{ width: 48, textAlign: "center", fontFamily: sans, fontWeight: 700, fontSize: 15, border: `1px solid ${line}`, borderRadius: 6, padding: "5px 2px", color: ink }} />
        <button onClick={() => mudar(valor + 1)} style={btnStep}><Icon name="plus" size={14} /></button>
      </div>
    </div>
  );
}

function EntradaRow({ nome, dados, onChangeQtd, onAnexar, onRemoverAnexo, iconId }) {
  const fileRef = useRef(null);
  const liberado = !!dados.foto;
  const [burst, setBurst] = useState(0);
  const mudarQtd = (v) => {
    onChangeQtd(v);
    setBurst((b) => b + 1);
  };
  const handleFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => onAnexar(reader.result, file.name);
    reader.readAsDataURL(file);
    e.target.value = "";
  };
  return (
    <div style={{ background: card, border: `1px solid ${line}`, borderRadius: 10, padding: "12px 14px", display: "flex", flexDirection: "column", gap: 10 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <ItemIcon id={iconId} />
          <span style={{ fontFamily: sans, fontWeight: 600, fontSize: 14.5, color: ink }}>{nome}</span>
        </div>
        {liberado && (
          <div style={{ position: "relative", display: "flex", alignItems: "center", gap: 10 }}>
            <SparkleBurst triggerKey={burst} />
            <button onClick={() => mudarQtd(Math.max(0, dados.qtd - 1))} style={btnStep}><Icon name="minus" size={14} /></button>
            <input type="number" value={dados.qtd}
              onChange={(e) => mudarQtd(Math.max(0, parseInt(e.target.value || "0", 10)))}
              style={{ width: 48, textAlign: "center", fontFamily: sans, fontWeight: 700, fontSize: 15, border: `1px solid ${line}`, borderRadius: 6, padding: "5px 2px", color: ink }} />
            <button onClick={() => mudarQtd(dados.qtd + 1)} style={btnStep}><Icon name="plus" size={14} /></button>
          </div>
        )}
      </div>
      {liberado ? (
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <img src={dados.foto} alt="Nota fiscal" style={{ width: 44, height: 44, objectFit: "cover", borderRadius: 6, border: `1px solid ${line}` }} />
          <span style={{ fontFamily: sans, fontSize: 12, color: inkSoft, flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{dados.nomeArquivo}</span>
          <button onClick={onRemoverAnexo} style={{ ...btnStep, color: danger, borderColor: danger }}><Icon name="trash" size={13} /></button>
        </div>
      ) : (
        <>
          <label style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 6, border: `1.5px dashed ${line}`, borderRadius: 8, padding: "9px", cursor: "pointer", color: accent, fontFamily: sans, fontWeight: 600, fontSize: 12.5 }}>
            <Icon name="paperclip" size={14} />
            Anexar nota fiscal
            <input ref={fileRef} type="file" accept="image/*" onChange={handleFile} style={{ display: "none" }} />
          </label>
          <div style={{ display: "flex", alignItems: "center", gap: 6, color: inkSoft, fontFamily: sans, fontSize: 11 }}>
            <Icon name="lock" size={12} />
            Anexe a nota fiscal para liberar a contagem
          </div>
        </>
      )}
    </div>
  );
}

function useDiaCarregado(tipo, dataInicial) {
  const [data, setData] = useState(dataInicial);
  const [valores, setValores] = useState(() => Object.fromEntries(ITEMS.map((i) => [i.id, tipo === "entrada" ? { qtd: 0, foto: null, nomeArquivo: null } : 0])));
  const [carregando, setCarregando] = useState(true);
  const [erro, setErro] = useState(false);

  useEffect(() => {
    let ativo = true;
    setCarregando(true);
    buscarRegistros(tipo, data).then((res) => {
      if (!ativo) return;
      setValores(res.base);
      setErro(res.error);
      setCarregando(false);
    });
    return () => { ativo = false; };
  }, [tipo, data]);

  return { data, setData, valores, setValores, carregando, erro };
}

function Contador({ tipo, dataInicial }) {
  const { data, setData, valores, setValores, carregando, erro } = useDiaCarregado(tipo, dataInicial);
  const [salvandoId, setSalvandoId] = useState(null);

  const mudar = async (id, v) => {
    setValores((prev) => ({ ...prev, [id]: v }));
    setSalvandoId(id);
    await salvarRegistro({ item_id: id, data, tipo, quantidade: v });
    setSalvandoId(null);
  };

  return (
    <div style={{ padding: 16, display: "flex", flexDirection: "column", gap: 10 }}>
      <DateBar data={data} setData={setData} />
      {carregando && <div style={{ fontFamily: sans, fontSize: 12, color: inkSoft, textAlign: "center" }}>Carregando...</div>}
      {erro && <div style={{ fontFamily: sans, fontSize: 11.5, color: danger, textAlign: "center" }}>Não foi possível conectar ao banco de dados.</div>}
      {!carregando && ITEMS.map((item) => (
        <ContadorRow key={item.id} nome={item.nome} valor={valores[item.id]} onChange={(v) => mudar(item.id, v)} iconId={item.id} />
      ))}
    </div>
  );
}

function Entradas({ dataInicial }) {
  const { data, setData, valores, setValores, carregando, erro } = useDiaCarregado("entrada", dataInicial);

  const mudarQtd = async (id, v) => {
    setValores((prev) => ({ ...prev, [id]: { ...prev[id], qtd: v } }));
    await salvarRegistro({ item_id: id, data, tipo: "entrada", quantidade: v });
  };
  const anexar = async (id, dataUrl, nome) => {
    setValores((prev) => ({ ...prev, [id]: { ...prev[id], foto: dataUrl, nomeArquivo: nome } }));
    await salvarRegistro({ item_id: id, data, tipo: "entrada", quantidade: valores[id].qtd, foto_url: dataUrl, nome_arquivo: nome });
  };
  const removerAnexo = async (id) => {
    setValores((prev) => ({ ...prev, [id]: { qtd: 0, foto: null, nomeArquivo: null } }));
    await salvarRegistro({ item_id: id, data, tipo: "entrada", quantidade: 0, foto_url: null, nome_arquivo: null });
  };

  return (
    <div style={{ padding: 16, display: "flex", flexDirection: "column", gap: 10 }}>
      <DateBar data={data} setData={setData} />
      {carregando && <div style={{ fontFamily: sans, fontSize: 12, color: inkSoft, textAlign: "center" }}>Carregando...</div>}
      {erro && <div style={{ fontFamily: sans, fontSize: 11.5, color: danger, textAlign: "center" }}>Não foi possível conectar ao banco de dados.</div>}
      {!carregando && ITEMS.map((item) => (
        <EntradaRow key={item.id} nome={item.nome} dados={valores[item.id]} iconId={item.id}
          onChangeQtd={(v) => mudarQtd(item.id, v)}
          onAnexar={(dataUrl, nome) => anexar(item.id, dataUrl, nome)}
          onRemoverAnexo={() => removerAnexo(item.id)} />
      ))}
    </div>
  );
}

function SenhaGate({ titulo, senhaCerta, onEntrar }) {
  const [senha, setSenha] = useState("");
  const [erro, setErro] = useState(false);
  const tentar = () => {
    if (senha === senhaCerta) onEntrar();
    else setErro(true);
  };
  return (
    <div style={{ padding: 16, display: "flex", flexDirection: "column", alignItems: "center", gap: 12, marginTop: 40 }}>
      <div style={{ width: 44, height: 44, borderRadius: 99, background: accentSoft, display: "flex", alignItems: "center", justifyContent: "center", color: accent }}>
        <Icon name="lock" size={20} />
      </div>
      <div style={{ fontFamily: sans, fontWeight: 700, fontSize: 15, color: ink }}>{titulo}</div>
      <input type="password" inputMode="numeric" value={senha}
        onChange={(e) => { setSenha(e.target.value); setErro(false); }}
        onKeyDown={(e) => e.key === "Enter" && tentar()}
        placeholder="Senha"
        style={{ width: 160, textAlign: "center", fontFamily: sans, fontSize: 15, border: `1px solid ${erro ? danger : line}`, borderRadius: 8, padding: "9px" }} />
      {erro && <div style={{ fontFamily: sans, fontSize: 12, color: danger }}>Senha incorreta</div>}
      <button onClick={tentar} style={{ background: accent, color: "#fff", border: "none", borderRadius: 8, padding: "9px 22px", fontFamily: sans, fontWeight: 700, fontSize: 13.5, cursor: "pointer" }}>Entrar</button>
    </div>
  );
}

function Financeiro({ dataInicial }) {
  const [desbloqueado, setDesbloqueado] = useState(false);
  const { data, setData, valores, setValores, carregando, erro } = useDiaCarregado("venda", dataInicial);

  const mudar = async (id, v) => {
    setValores((prev) => ({ ...prev, [id]: v }));
    await salvarRegistro({ item_id: id, data, tipo: "venda", quantidade: v });
  };

  if (!desbloqueado) {
    return <SenhaGate titulo="Área protegida" senhaCerta={SENHA_FINANCEIRO} onEntrar={() => setDesbloqueado(true)} />;
  }

  return (
    <div style={{ padding: 16, display: "flex", flexDirection: "column", gap: 10 }}>
      <DateBar data={data} setData={setData} />
      {carregando && <div style={{ fontFamily: sans, fontSize: 12, color: inkSoft, textAlign: "center" }}>Carregando...</div>}
      {erro && <div style={{ fontFamily: sans, fontSize: 11.5, color: danger, textAlign: "center" }}>Não foi possível conectar ao banco de dados.</div>}
      {!carregando && ITEMS.map((item) => (
        <ContadorRow key={item.id} nome={item.nome} valor={valores[item.id]} onChange={(v) => mudar(item.id, v)} iconId={item.id} />
      ))}
      <button onClick={() => setDesbloqueado(false)} style={{ marginTop: 4, background: "transparent", border: "none", color: inkSoft, fontFamily: sans, fontSize: 12, cursor: "pointer", textAlign: "center" }}>
        Bloquear novamente
      </button>
    </div>
  );
}

const ETAPAS_CONFRONTO = [
  "Coletando dados do estoque...",
  "Coletando dados de entradas...",
  "Coletando dados de perdas...",
  "Coletando dados financeiros (vendas)...",
  "Cruzando informações e calculando inconsistências...",
];

function nomeDoItem(id) {
  const item = ITEMS.find((i) => i.id === id);
  return item ? item.nome : id;
}

function HistoricoConfrontos({ recarregarChave }) {
  const [historico, setHistorico] = useState([]);
  const [carregando, setCarregando] = useState(true);
  const [erro, setErro] = useState(false);

  useEffect(() => {
    let ativo = true;
    setCarregando(true);
    sb
      .from("confrontos")
      .select("*")
      .order("data_referencia", { ascending: false })
      .order("executado_em", { ascending: false })
      .limit(80)
      .then(({ data, error }) => {
        if (!ativo) return;
        if (error || !data) { setErro(true); setCarregando(false); return; }
        const grupos = {};
        data.forEach((r) => {
          const chave = r.data_referencia + "|" + r.executado_em;
          if (!grupos[chave]) grupos[chave] = { data_referencia: r.data_referencia, executado_em: r.executado_em, itens: [] };
          grupos[chave].itens.push(r);
        });
        setHistorico(Object.values(grupos));
        setErro(false);
        setCarregando(false);
      });
    return () => { ativo = false; };
  }, [recarregarChave]);

  if (carregando) return <div style={{ fontFamily: sans, fontSize: 12, color: inkSoft, textAlign: "center", padding: 16 }}>Carregando histórico...</div>;
  if (erro) return <div style={{ fontFamily: sans, fontSize: 11.5, color: danger, textAlign: "center", padding: 16 }}>Não foi possível carregar o histórico.</div>;
  if (historico.length === 0) return <div style={{ fontFamily: sans, fontSize: 12, color: inkSoft, textAlign: "center", padding: 16 }}>Nenhum confronto executado ainda.</div>;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 12, padding: "0 16px 16px" }}>
      {historico.map((grupo) => {
        const temAlerta = grupo.itens.some((i) => i.status === "alerta");
        return (
          <div key={grupo.data_referencia + grupo.executado_em} style={{ background: card, border: `1px solid ${temAlerta ? danger : line}`, borderRadius: 10, padding: "12px 14px", display: "flex", flexDirection: "column", gap: 8 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span style={{ fontFamily: sans, fontWeight: 800, fontSize: 13.5, color: ink }}>Referente a {formatarData(grupo.data_referencia)}</span>
              <span style={{ fontFamily: sans, fontSize: 10.5, color: inkSoft }}>{formatarDataHora(grupo.executado_em)}</span>
            </div>
            {grupo.itens.map((r) => (
              <div key={r.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontFamily: sans, fontSize: 12, color: r.status === "alerta" ? danger : ink }}>
                <span style={{ fontWeight: 600 }}>{nomeDoItem(r.item_id)}</span>
                {r.status === "alerta" ? (
                  <span style={{ fontWeight: 700 }}>esperado {r.estoque_esperado}, contado {r.estoque_contado} (dif. {r.diferenca})</span>
                ) : (
                  <span style={{ color: good, fontWeight: 700 }}>OK</span>
                )}
              </div>
            ))}
          </div>
        );
      })}
    </div>
  );
}

function Confronto() {
  const [desbloqueado, setDesbloqueado] = useState(false);
  const [rodando, setRodando] = useState(false);
  const [progresso, setProgresso] = useState(0);
  const [etapaTexto, setEtapaTexto] = useState("");
  const [msgFinal, setMsgFinal] = useState(null);
  const [recarregarChave, setRecarregarChave] = useState(0);

  const confrontarAgora = () => {
    setMsgFinal(null);
    setRodando(true);
    setProgresso(0);
    let passo = 0;
    const proximo = async () => {
      if (passo >= ETAPAS_CONFRONTO.length) {
        try {
          const resp = await fetch(`${SUPABASE_URL}/functions/v1/confronto-diario`, {
            method: "POST",
            headers: { Authorization: `Bearer ${SUPABASE_ANON_KEY}`, "Content-Type": "application/json" },
            body: "{}",
          });
          if (!resp.ok) throw new Error("falha");
          setMsgFinal({ ok: true, texto: "Confronto executado com sucesso." });
        } catch (e) {
          setMsgFinal({ ok: false, texto: "Não foi possível executar o confronto agora." });
        }
        setRodando(false);
        setRecarregarChave((k) => k + 1);
        return;
      }
      setEtapaTexto(ETAPAS_CONFRONTO[passo]);
      setProgresso(Math.round(((passo + 1) / ETAPAS_CONFRONTO.length) * 100));
      passo++;
      setTimeout(proximo, 450);
    };
    proximo();
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      <div style={{ padding: "16px 16px 0" }}>
        <div style={{ fontFamily: sans, fontWeight: 800, fontSize: 13.5, color: ink, marginBottom: 8 }}>Histórico de confrontos</div>
      </div>
      <HistoricoConfrontos recarregarChave={recarregarChave} />

      <div style={{ padding: "0 16px 16px", display: "flex", flexDirection: "column", gap: 12 }}>
        {!desbloqueado ? (
          <SenhaGate titulo="Rodar confronto manualmente" senhaCerta={SENHA_CONFRONTO} onEntrar={() => setDesbloqueado(true)} />
        ) : (
          <>
            <div className="battle-stage">
              <div className="bolinho-fighter left"><BolinhoFighter mirrored={false} /></div>
              <div className="bolinho-fighter right"><BolinhoFighter mirrored={true} /></div>
              <button className="confrontar-btn" onClick={confrontarAgora} disabled={rodando}>
                {rodando ? "Analisando..." : "⚔ Confrontar agora"}
              </button>
            </div>

            {rodando && (
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                <div style={{ fontFamily: sans, fontSize: 12, color: inkSoft, textAlign: "center" }}>{etapaTexto}</div>
                <div style={{ width: "100%", height: 8, background: accentSoft, borderRadius: 99, overflow: "hidden" }}>
                  <div style={{ width: `${progresso}%`, height: "100%", background: accent, borderRadius: 99, transition: "width 0.5s ease" }} />
                </div>
              </div>
            )}

            {msgFinal && !rodando && (
              <div style={{ fontFamily: sans, fontWeight: 700, fontSize: 12.5, color: msgFinal.ok ? good : danger, textAlign: "center" }}>
                {msgFinal.texto}
              </div>
            )}

            <div style={{ fontFamily: sans, fontSize: 10.5, color: inkSoft, textAlign: "center" }}>
              O confronto também roda sozinho, automaticamente, todo dia às 6h.
            </div>

            <button onClick={() => setDesbloqueado(false)} style={{ marginTop: 4, background: "transparent", border: "none", color: inkSoft, fontFamily: sans, fontSize: 12, cursor: "pointer", textAlign: "center" }}>
              Bloquear novamente
            </button>
          </>
        )}
      </div>
    </div>
  );
}

const TABS = [
  { id: "estoque", label: "Estoque" },
  { id: "entradas", label: "Entradas" },
  { id: "perdas", label: "Perdas" },
  { id: "financeiro", label: "Financeiro" },
  { id: "confronto", label: "Confronto" },
];

function App() {
  const [tab, setTab] = useState("estoque");

  return (
    <div style={{ minHeight: "100vh", background: bgStripes, display: "flex", justifyContent: "center", padding: "24px 0", fontFamily: sans }}>
      <div style={{ width: 390, maxWidth: "100%", background: card, borderRadius: 20, border: `1px solid ${line}`, boxShadow: "0 16px 40px rgba(59,42,30,0.18)", overflow: "hidden", display: "flex", flexDirection: "column", height: 720 }}>
        <div style={{ padding: "16px 16px 0" }}>
          <div style={{ fontFamily: sans, fontWeight: 800, fontSize: 17, color: ink, marginBottom: 2 }}>Fofíssimo Controle</div>
          <div style={{ fontFamily: sans, fontSize: 10.5, color: inkSoft, marginBottom: 12 }}>Dados salvos na nuvem — compartilhado entre todos</div>
          <div style={{ display: "flex", gap: 4, background: accentSoft, borderRadius: 10, padding: 3 }}>
            {TABS.map((t) => (
              <button key={t.id} onClick={() => setTab(t.id)} style={{
                flex: 1, border: "none", borderRadius: 8, padding: "8px 0", cursor: "pointer",
                fontFamily: sans, fontWeight: 700, fontSize: 11.5,
                background: tab === t.id ? accent : "transparent",
                color: tab === t.id ? "#fff" : accent,
              }}>
                {t.label}
              </button>
            ))}
          </div>
        </div>

        <div style={{ flex: 1, overflowY: "auto" }}>
          {tab === "estoque" && <Contador tipo="contagem" dataInicial={ontemStr()} />}
          {tab === "entradas" && <Entradas dataInicial={hojeStr()} />}
          {tab === "perdas" && <Contador tipo="perda" dataInicial={hojeStr()} />}
          {tab === "financeiro" && <Financeiro dataInicial={ontemStr()} />}
          {tab === "confronto" && <Confronto />}
        </div>
      </div>
    </div>
  );
}

document.getElementById("root").dataset.rendered = "1";
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
